{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title|default:"Category" }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'category_list' %}">Categories</a></li>
                <li class="breadcrumb-item active">{{ title|default:"Category" }}</li>
            </ol>
        </nav>
        <div class="card">
            <div class="card-header"><h5 class="card-title mb-0">{{ title|default:"Category" }}</h5></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
