{% extends 'base.html' %}
{% block title %}Delete Health Check{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><h5 class="mb-0">Delete Health Check</h5></div>
            <div class="card-body">
                <p>Are you sure you want to delete <strong>{{ health_check.name }}</strong>? This will also remove its sessions and cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url 'health_check_detail' health_check.id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
